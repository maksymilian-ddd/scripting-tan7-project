<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word clouds: Digital Decade country reports</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f3f2ef; --surface-1: #fcfcfb; --border: #e4e3df;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
    --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #dbe8f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
      --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1e3350;
    }
  }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--surface-0); color: var(--text-primary); }
  header, main { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  p.note { color: var(--text-secondary); margin: 0; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .grid { display: grid; gap: 12px; margin-top: 12px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .pair img { display: block; width: 100%; border-radius: 6px; border: 1px solid var(--border); }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 12px; align-items: start; }
  #panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .cloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .word { cursor: pointer; border: 0; background: none; color: var(--text-primary); padding: 1px 4px;
          border-radius: 4px; font-family: inherit; line-height: 1.15; text-align: left; }
  .word:hover { background: var(--accent-soft); }
  .word.hit { background: var(--accent); color: var(--accent-ink); }
  .word::after { content: " " attr(data-label); font-size: 11px; color: var(--text-muted);
                 font-variant-numeric: tabular-nums; display: none; }
  .show-labels .word::after, .word.hit::after { display: inline; }
  .word.hit::after { color: var(--accent-ink); }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--text-secondary); cursor: pointer; }
  .card.dim { opacity: .35; }
  .card.has-hit { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 96px 1fr 50px 30px; gap: 8px; align-items: center; padding: 2px 0; }
  .row a { color: var(--text-primary); text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  .bar { height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .num { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .top { color: var(--text-muted); font-size: 12px; }
  .row.head { color: var(--text-muted); font-size: 12px; }
  @media (max-width: 800px) { .layout, .pair { grid-template-columns: 1fr; } #panel { position: static; } }
</style>

const name = c => c[0].toUpperCase() + c.slice(1);
let selected = null;

// Font size in px, linear between 12 and 44 over [min, max] of the values.
function scale(values) {
  const lo = Math.min(...values), hi = Math.max(...values);
  return v => 12 + (hi > lo ? (v - lo) / (hi - lo) : 0) * 32;
}

function wordButton(term, size, tooltip, label) {
  const b = document.createElement("button");
  b.className = "word";
  b.textContent = term;
  b.dataset.term = term;
  b.style.fontSize = size + "px";
  b.title = tooltip;
  b.dataset.label = label;
  b.onclick = () => select(selected === term ? null : term);
  return b;
}

// Words in alphabetical order, as in a classic tag cloud.
function fillCloud(el, words) {
  words.slice().sort((a, b) => a.term.localeCompare(b.term))
    .forEach(w => el.append(wordButton(w.term, w.size, w.tooltip, w.label)));
}

// Common terms (size by total count).
const commonSize = scale(DATA.common.map(([, total]) => Math.sqrt(total)));
fillCloud(document.getElementById("common"), DATA.common.map(([term, total, df]) => ({
  term, size: commonSize(Math.sqrt(total)), tooltip: `${term}: ${total}× in ${df} reports`,
  label: `${total}×`,
})));

// One cloud per country (size by TF-IDF score, scaled within each cloud).
const grid = document.getElementById("grid");
for (const [country, terms] of Object.entries(DATA.countries)) {
  const card = document.createElement("section");
  card.className = "card";
  card.id = country;
  // The bar chart from tfidf.py sits next to the cloud; it is hidden if the PNG is missing.
  card.innerHTML = `<h2>${name(country)}</h2>
    <div class="pair">
      <div class="cloud"></div>
      <a href="charts/top_terms_${country}.png" target="_blank" title="Open full size">
        <img src="charts/top_terms_${country}.png" alt="${name(country)}: top 20 terms, bar chart"
             loading="lazy" onerror="this.parentElement.remove()"></a>
    </div>`;
  const size = scale(terms.map(([, score]) => score));
  fillCloud(card.querySelector(".cloud"), terms.map(([term, score, count], i) => ({
    term, size: size(score), label: score.toFixed(3),
    tooltip: `${term}: rank ${i + 1}, score ${score.toFixed(4)}, ${count}× in this report`,
  })));
  grid.append(card);
}

// Highlight the selected word everywhere and list the reports that contain it.
function select(term) {
  selected = term;
  const counts = term ? DATA.counts[term] : {};
  document.querySelectorAll(".word").forEach(w => w.classList.toggle("hit", w.dataset.term === term));
  document.querySelectorAll("#grid .card").forEach(card => {
    card.classList.toggle("dim", !!term && !(card.id in counts));
    card.classList.toggle("has-hit", !!term && !!card.querySelector(".word.hit"));
  });

  const panel = document.getElementById("panel");
  if (!term) { panel.innerHTML = '<p class="note">No word selected.</p>'; return; }
  // Bars show the TF-IDF score; terms that max_df drops have no score, so bars show the count.
  const hasScore = Object.values(counts).some(([, score]) => score !== null);
  const value = ([count, score]) => hasScore ? score : count;
  const rows = Object.entries(counts).sort((a, b) => value(b[1]) - value(a[1]));
  const max = Math.max(...rows.map(([, v]) => value(v)));
  const inTop = c => DATA.countries[c].some(([t]) => t === term);
  panel.innerHTML = `
    <h2>“${term}”</h2>
    <p class="note">In ${rows.length} of ${Object.keys(DATA.countries).length} reports.
      ★ = in that country's top 20.
      ${hasScore ? "" : "No TF-IDF score: max_df drops terms found in more than half the reports."}</p>
    <div style="margin-top:8px">
      <div class="row head"><span>report</span><span>bar: ${hasScore ? "score" : "count"}</span>
        <span class="num">score</span><span class="num">count</span></div>
      ${rows.map(([c, v]) => `
      <div class="row">
        <a href="#${c}">${name(c)} ${inTop(c) ? '<span class="top">★</span>' : ""}</a>
        <div class="bar" style="width:${(100 * value(v) / max).toFixed(1)}%"></div>
        <span class="num">${v[1] === null ? "–" : v[1].toFixed(3)}</span>
        <span class="num">${v[0]}</span>
      </div>`).join("")}
    </div>`;
}

document.addEventListener("keydown", e => { if (e.key === "Escape") select(null); });
document.getElementById("show-labels").onchange = e =>
  document.body.classList.toggle("show-labels", e.target.checked);
</script>
